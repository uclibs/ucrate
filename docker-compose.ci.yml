# CI dependency stack for GitHub Actions (Scholar@UC / hyku-oob).
# Started by .github/workflows/ci.yml — one stack per parallel test shard.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hyku_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  fcrepo:
    image: ghcr.io/samvera/fcrepo4:4.7.5
    environment:
      JAVA_OPTS: >-
        -Djava.awt.headless=true
        -Dfcrepo.modeshape.configuration=classpath:/config/file-simple/repository.json
        -Dfcrepo.object.directory=/data/objects
        -Dfcrepo.binary.directory=/data/binaries
    ports:
      - "8080:8080"

  # SolrCloud with embedded ZooKeeper (same approach as develop CircleCI: solr -cloud)
  solr:
    image: solr:8.11.2
    command: ["solr-foreground", "-c"]
    ports:
      - "8983:8983"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  chrome:
    image: selenium/standalone-chromium:latest
    ports:
      - "4444:4444"
    shm_size: "2gb"
    # Rails runs on the GHA host; Chrome must reach it via the Docker host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
